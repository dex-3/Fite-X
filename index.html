<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITE-X — Hexagonal Character Select</title>
<style>
:root{--bg:#050608;--panel:#0d1015;--text:#f4f6f8;--muted:#8b94a2;--accent:#8cff45;--line:#252c36;--tone:#18291a;--glow:#8cff45}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:42px 42px}
.app{position:relative;width:100%;height:100%}.screen{position:absolute;inset:0;transition:transform .8s cubic-bezier(.77,0,.18,1),opacity .8s ease}
.roster-screen{display:flex;flex-direction:column;align-items:center;padding:42px 4vw 25px;overflow:auto}
.brand{position:absolute;top:25px;left:35px;font-size:22px;font-weight:900;letter-spacing:.18em}.brand span{color:var(--accent)}
.title{margin-top:30px;text-align:center;font-size:clamp(35px,5vw,70px);font-weight:900;letter-spacing:-.055em;line-height:.9}
.subtitle{margin-top:12px;font-size:10px;letter-spacing:.35em;color:var(--muted)}
.hex-grid{width:min(1050px,92vw);display:grid;grid-template-columns:repeat(5,1fr);gap:25px 18px;margin:48px auto 30px}
.hex-wrap{height:180px;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:.25s}
.hex{width:145px;height:168px;position:relative;clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);background:var(--line);padding:2px;transition:.3s;filter:drop-shadow(0 0 0 transparent)}
.hex-inner{width:100%;height:100%;clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);background:radial-gradient(circle at 50% 30%,var(--glow),transparent 45%),linear-gradient(145deg,var(--tone),#080a0e 75%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.hex-inner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent 55%);opacity:.85}
.initial{font-size:60px;font-weight:900;color:rgba(255,255,255,.12);position:absolute}
.hex-name{position:absolute;bottom:20px;z-index:2;text-align:center;font-size:10px;font-weight:900;letter-spacing:.05em;width:90%;text-shadow:0 2px 5px #000}
.hex-number{position:absolute;top:18px;z-index:2;font-size:8px;letter-spacing:.18em;color:#dfe5eb}
.hex-wrap:hover{transform:scale(1.09)}.hex-wrap:hover .hex{background:var(--accent);filter:drop-shadow(0 0 14px rgba(140,255,69,.55))}
.hint{font-size:9px;letter-spacing:.25em;color:#555e6a;margin-top:auto}
.detail-screen{transform:translateX(100%);opacity:0;display:grid;grid-template-columns:48% 52%;background:var(--bg);overflow:auto}
.detail-art{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,var(--glow),transparent 38%),linear-gradient(145deg,var(--tone),#06070a 70%);border-right:1px solid var(--line)}
.detail-art:before{content:"";position:absolute;inset:7%;border:1px solid rgba(255,255,255,.07);clip-path:polygon(12% 0,88% 0,100% 15%,100% 85%,88% 100%,12% 100%,0 85%,0 15%)}
.big-initial{font-size:min(35vw,420px);font-weight:900;color:rgba(255,255,255,.07)}
.back{position:absolute;top:25px;left:25px;z-index:5;border:1px solid var(--line);background:#0b0e13;color:#fff;padding:12px 17px;font-size:10px;letter-spacing:.16em;cursor:pointer}.back:hover{border-color:var(--accent);color:var(--accent)}
.detail-info{padding:clamp(50px,7vw,100px) clamp(30px,6vw,90px);display:flex;justify-content:center;flex-direction:column}
.code{color:var(--accent);font-size:10px;letter-spacing:.3em;font-weight:900}.name{font-size:clamp(46px,6vw,90px);font-weight:900;letter-spacing:-.06em;line-height:.86;margin:14px 0}.style{font-size:12px;color:var(--muted);letter-spacing:.22em}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin:35px 0}.meta div{background:var(--panel);padding:15px 12px}.meta b{display:block;color:var(--muted);font-size:8px;letter-spacing:.15em;margin-bottom:8px}.meta span{font-size:12px;font-weight:800}
.bio-title{font-size:9px;letter-spacing:.25em;color:var(--accent);font-weight:900}.bio{color:#aeb6c1;line-height:1.75;font-size:14px;max-width:650px;margin:10px 0 25px}.stat{display:grid;grid-template-columns:85px 1fr 32px;gap:12px;align-items:center;margin:11px 0;font-size:9px;letter-spacing:.14em}.bar{height:5px;background:#222832}.fill{height:100%;background:var(--accent);box-shadow:0 0 12px rgba(140,255,69,.45)}
.roster-screen.leave{transform:translateX(-100%);opacity:0}.detail-screen.show{transform:translateX(0);opacity:1}
@media(max-width:850px){.hex-grid{grid-template-columns:repeat(4,1fr);gap:12px}.hex{width:115px;height:133px}.hex-wrap{height:145px}.detail-screen{grid-template-columns:1fr}.detail-art{min-height:45vh;height:45vh}.detail-info{padding:35px 7vw}.meta{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.brand{left:18px;font-size:17px}.title{margin-top:45px}.hex-grid{grid-template-columns:repeat(3,1fr);gap:7px}.hex{width:92px;height:107px}.hex-wrap{height:112px}.initial{font-size:40px}.hex-name{font-size:8px;bottom:13px}.hex-number{top:12px;font-size:7px}.detail-art{min-height:38vh;height:38vh}.name{font-size:42px}.meta{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<section class="screen roster-screen" id="rosterScreen">
<div class="brand">FITE<span>-X</span></div>
<div class="title">PICK YOUR CHARACTER</div>
<div class="subtitle">FIGHTER SELECT // 25 AVAILABLE</div>
<div class="hex-grid" id="hexGrid"></div>
<div class="hint">SELECT A FIGHTER TO CONTINUE</div>
</section>

<section class="screen detail-screen" id="detailScreen">
<button class="back" onclick="goBack()">← CHARACTER SELECT</button>
<div class="detail-art" id="detailArt"><div class="big-initial" id="bigInitial">?</div></div>
<div class="detail-info">
<div class="code" id="dCode">FIGHTER 001</div>
<div class="name" id="dName">RION ADACHI</div>
<div class="style" id="dStyle">KICKBOXING</div>
<div class="meta">
<div><b>AGE</b><span id="dAge">24</span></div><div><b>COUNTRY</b><span id="dCountry">JAPAN</span></div><div><b>HEIGHT</b><span id="dHeight">168 CM</span></div><div><b>CLASS</b><span id="dClass">STRIKER</span></div>
</div>
<div class="bio-title">BIOGRAPHY</div>
<div class="bio" id="dBio"></div>
<div id="stats"></div>
</div>
</section>
</div>

<script>
const fighters=[
["RION ADACHI","KICKBOXING",24,"JAPAN","168 CM","STRIKER","A sharp and disciplined striker known for explosive combinations and relentless forward pressure.",82,94,88,76,"#36131d","#ff365e"],
["CLAUDINE","HYBRID COMBAT",23,"FRANCE","171 CM","ALL-ROUNDER","Bright, confident, and deceptively technical. She mixes fast boxing with throws and close-range control.",79,89,92,84,"#18351b","#72ff52"],
["KANADE","SUBMISSION GRAPPLING",25,"JAPAN","165 CM","GRAPPLER","A calm specialist who turns chaotic exchanges into positional battles and technical transitions.",74,81,97,91,"#111d3d","#4f7dff"],
["NAGISA","BOXING",22,"JAPAN","166 CM","PRESSURE","An aggressive boxer with excellent conditioning who constantly closes distance and controls rhythm.",86,87,83,78,"#3d1b14","#ff713f"],
["ELENA MIYAZAWA","MUAY THAI",26,"JAPAN","173 CM","STRIKER","A composed veteran who relies on timing, range management, and punishing counters.",91,79,95,87,"#172c38","#39d8ff"],
["MIRAI","MMA",21,"JAPAN","160 CM","HYBRID","A young competitor whose unpredictable movement mixes striking entries with sudden takedowns.",72,96,85,80,"#30183d","#c05cff"],
["RODINA","KICKBOXING",27,"ENGLAND","176 CM","RANGE","Tall and precise, Rodina uses distance, footwork, and long attacks to dictate exchanges.",84,82,94,89,"#30291b","#ffd35a"],
["MONICA","TAEKWONDO",23,"CANADA","169 CM","MOBILITY","A mobile kicker who constantly changes rhythm and creates angles through movement.",75,98,90,81,"#17322e","#47ffc7"],
["SAKURA HAGIWARA","KARATE",22,"JAPAN","164 CM","STRIKER","A disciplined karate fighter focused on precision, timing, and explosive counters.",80,91,93,82,"#321a2a","#ff5fa2"],
["SETSUNA YUKI","MMA",25,"JAPAN","167 CM","HYBRID","A versatile fighter combining boxing, wrestling, and fast transitions.",84,88,90,86,"#302018","#ff684d"],
["AYAMI","SHOOT WRESTLING",24,"JAPAN","162 CM","GRAPPLER","A technical fighter who blends takedowns with close-range striking and positional pressure.",86,85,94,88,"#132f36","#3df0ff"],
["ALINA ENGEL","SAMBO",25,"AUSTRIA","170 CM","GRAPPLER","A powerful grappler who specializes in throws, control, and sudden reversals.",93,78,91,90,"#261c38","#a86cff"],
["RIKKA TAKARADA","MMA",24,"JAPAN","157 CM","HYBRID","A compact all-rounder with sharp reactions and an instinct for exploiting openings.",79,95,89,83,"#172d3a","#5ad8ff"],
["MUJINA","KICKBOXING",26,"JAPAN","172 CM","STRIKER","An unpredictable striker who uses feints and unusual angles to break an opponent's rhythm.",88,90,86,79,"#35203c","#d15cff"],
["CHIHAYA","KARATE",23,"JAPAN","161 CM","TECHNICAL","A patient technician who favors clean combinations and efficient movement.",77,88,96,92,"#352318","#ff9b54"],
["SHOKO FUJITA","BOXING",27,"JAPAN","169 CM","PRESSURE","A durable boxer with heavy combinations and excellent conditioning.",92,83,87,85,"#2e1717","#ff4545"],
["JUNA CRAWFORD","JUDO",28,"UNITED STATES","175 CM","GRAPPLER","A strong judoka who uses balance breaking, throws, and clinch control.",94,76,93,91,"#202b1b","#9cff50"],
["HIMIKO","MMA",26,"JAPAN","166 CM","HYBRID","A tactical fighter built around deception, movement, and unconventional entries.",81,94,95,88,"#17171f","#a6a6ff"],
["HIMEKO","KICKBOXING",20,"JAPAN","163 CM","SPEED","A young speed specialist who relies on combinations and constant lateral movement.",70,99,84,77,"#3a182d","#ff62ae"],
["KANON","MMA",19,"JAPAN","159 CM","ROOKIE","A promising newcomer with exceptional speed and a rapidly developing technical base.",68,97,78,74,"#193326","#5dff9b"],
["ANGELICA","SAMBO",25,"BELARUS","174 CM","POWER","A powerful throw specialist who combines strength with disciplined grappling.",97,79,89,93,"#20233b","#738cff"],
["REVINE","MMA",24,"UNKNOWN","167 CM","ALL-ROUNDER","A mysterious all-rounder whose adaptable style changes according to the opponent.",88,90,94,90,"#242018","#d9b65c"],
["CALLISTA","BOXING / JUDO",26,"UNKNOWN","171 CM","HYBRID","A balanced fighter with polished boxing fundamentals and dangerous clinch transitions.",90,86,93,89,"#271d30","#d16cff"],
["ALINA VOSS","MUAY THAI",24,"GERMANY","172 CM","STRIKER","A disciplined counter striker with a patient approach and powerful finishing combinations.",89,84,92,88,"#172d2b","#51e0b2"],
["KIRA MORI","WRESTLING",22,"JAPAN","164 CM","GRAPPLER","A relentless wrestler who specializes in pressure, takedowns, and positional control.",87,92,90,85,"#2c2015","#f1a13f"]
];

const grid=document.getElementById("hexGrid");
const initials=n=>n.replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase();
fighters.forEach((f,i)=>{
 const wrap=document.createElement("div");wrap.className="hex-wrap";
 wrap.innerHTML=`<div class="hex" style="--tone:${f[11]};--glow:${f[12]}"><div class="hex-inner"><div class="hex-number">${String(i+1).padStart(2,"0")}</div><div class="initial">${initials(f[0])}</div><div class="hex-name">${f[0]}</div></div></div>`;
 wrap.onclick=()=>selectCharacter(i);grid.appendChild(wrap);
});

function selectCharacter(i){
 const f=fighters[i], detail=document.getElementById("detailScreen"), roster=document.getElementById("rosterScreen");
 document.documentElement.style.setProperty("--tone",f[11]);document.documentElement.style.setProperty("--glow",f[12]);
 document.getElementById("dCode").textContent=`FIGHTER ${String(i+1).padStart(3,"0")}`;
 document.getElementById("dName").textContent=f[0];document.getElementById("dStyle").textContent=f[1];
 document.getElementById("dAge").textContent=f[2];document.getElementById("dCountry").textContent=f[3];document.getElementById("dHeight").textContent=f[4];document.getElementById("dClass").textContent=f[5];document.getElementById("dBio").textContent=f[6];
 document.getElementById("bigInitial").textContent=initials(f[0]);
 document.getElementById("detailArt").style.setProperty("--tone",f[11]);document.getElementById("detailArt").style.setProperty("--glow",f[12]);
 const labels=["POWER","SPEED","TECHNIQUE","DEFENSE"];
 document.getElementById("stats").innerHTML=labels.map((x,j)=>`<div class="stat"><span>${x}</span><div class="bar"><div class="fill" style="width:${f[7+j]}%"></div></div><b>${f[7+j]}</b></div>`).join("");
 roster.classList.add("leave");detail.classList.add("show");
}
function goBack(){document.getElementById("detailScreen").classList.remove("show");document.getElementById("rosterScreen").classList.remove("leave")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")goBack()});
</script>
</body>
</html>
