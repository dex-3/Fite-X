<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>dex-3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#03060a;
    color:#edf6ff;
    font-family:"Oxanium",sans-serif;
    overflow:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:-100px;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}

.grid{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(45,86,125,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(45,86,125,.055) 1px,
            transparent 1px
        );

    background-size:72px 72px;

    animation:gridMove 18s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0,0 0;
    }

    to{
        background-position:72px 72px,72px 72px;
    }

}


.glow{
    position:absolute;

    width:70vw;
    height:70vw;

    max-width:1000px;
    max-height:1000px;

    left:55%;
    top:48%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(42,76,115,.16) 0%,
            rgba(42,76,115,.08) 30%,
            transparent 70%
        );

    filter:blur(8px);

    animation:
        glowMove 14s ease-in-out infinite alternate;
}

@keyframes glowMove{

    0%{
        transform:
            translate(-54%,-48%)
            scale(.95);
    }

    100%{
        transform:
            translate(-46%,-52%)
            scale(1.05);
    }

}


.diagonal-light{
    position:absolute;
    inset:-100%;

    background:
        linear-gradient(
            135deg,
            transparent 0 46%,
            rgba(80,150,220,.045) 46.1% 46.2%,
            transparent 46.3%
        );

    animation:
        diagonalMove 22s linear infinite;
}

@keyframes diagonalMove{

    0%{
        transform:translate(-2%,-2%);
    }

    50%{
        transform:translate(2%,2%);
    }

    100%{
        transform:translate(-2%,-2%);
    }

}


.scanline{
    position:absolute;

    width:100%;
    height:1px;

    top:-10%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(100,180,240,.10),
            transparent
        );

    animation:
        scan 10s linear infinite;
}

@keyframes scan{

    0%{
        top:-10%;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    100%{
        top:110%;
        opacity:0;
    }

}


/* =========================================================
   PARTICLES
========================================================= */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:
        rgba(130,200,255,.5);

    box-shadow:
        0 0 8px rgba(100,190,255,.35);

    animation:
        particleFloat var(--duration)
        ease-in-out infinite alternate,

        particleBlink var(--blink)
        ease-in-out infinite;
}

@keyframes particleFloat{

    from{
        transform:translate(0,0);
    }

    to{
        transform:
            translate(
                var(--move-x),
                var(--move-y)
            );
    }

}

@keyframes particleBlink{

    0%,100%{
        opacity:.15;
    }

    50%{
        opacity:.8;
    }

}


/* =========================================================
   CORNER FRAME
========================================================= */

.frame{
    position:fixed;
    inset:28px;

    border:
        1px solid
        rgba(90,166,235,.18);

    pointer-events:none;

    z-index:1;
}

.frame:before,
.frame:after{
    content:"";

    position:absolute;

    width:55px;
    height:55px;

    border-color:
        rgba(90,166,235,.5);
}

.frame:before{
    left:-1px;
    top:-1px;

    border-left:1px solid;
    border-top:1px solid;
}

.frame:after{
    right:-1px;
    bottom:-1px;

    border-right:1px solid;
    border-bottom:1px solid;
}


/* =========================================================
   MAIN UI
========================================================= */

.interface{
    position:relative;

    width:100%;
    height:100vh;

    z-index:5;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome{
    position:absolute;

    top:65px;
    right:75px;

    font-size:13px;

    font-weight:400;

    letter-spacing:.24em;

    color:#c8d9e9;

    text-transform:uppercase;
}


/* =========================================================
   DEX-3
========================================================= */

.brand{
    position:absolute;

    right:75px;
    bottom:62px;

    font-size:30px;

    font-weight:500;

    letter-spacing:-.05em;

    color:#edf6ff;

    text-shadow:
        0 0 25px
        rgba(100,180,255,.18);
}


/* =========================================================
   LEFT NAVIGATION
========================================================= */

.navigation{
    position:absolute;

    left:65px;
    top:50%;

    transform:translateY(-50%);

    width:230px;

    padding:28px 24px;

    border:
        1px solid
        rgba(90,166,235,.42);

    background:
        rgba(3,9,15,.70);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    clip-path:
        polygon(
            15px 0,
            calc(100% - 15px) 0,
            100% 15px,
            100% calc(100% - 15px),
            calc(100% - 15px) 100%,
            15px 100%,
            0 calc(100% - 15px),
            0 15px
        );

    box-shadow:
        0 0 35px
        rgba(30,90,140,.08);

}


/* =========================================================
   NAV ITEMS
========================================================= */

.nav-button{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border:0;

    background:transparent;

    color:#dceeff;

    font-family:"Oxanium",sans-serif;

    font-size:14px;

    font-weight:500;

    letter-spacing:.12em;

    text-align:left;

    padding:12px 4px;

    cursor:pointer;

    transition:
        color .25s,
        transform .25s,
        text-shadow .25s;
}

.nav-button:hover{

    color:#8fd0ff;

    transform:translateX(5px);

    text-shadow:
        0 0 14px
        rgba(100,190,255,.6);
}

.nav-button.active{

    color:#8fd0ff;

    text-shadow:
        0 0 15px
        rgba(100,190,255,.5);
}

.nav-arrow{

    font-size:12px;

    opacity:.65;

    transition:
        transform .25s;
}

.nav-button.active .nav-arrow{

    transform:
        translateX(4px);
}


/* =========================================================
   NAV DIVIDER
========================================================= */

.nav-divider{

    width:100%;
    height:1px;

    margin:14px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(90,166,235,.35),
            transparent
        );
}


/* =========================================================
   MUSIC BOX
========================================================= */

.music-section{

    max-height:0;

    overflow:hidden;

    opacity:0;

    transition:
        max-height .4s ease,
        opacity .3s ease;
}

.music-section.open{

    max-height:100px;

    opacity:1;
}


.music-box{

    margin-top:8px;

    padding:13px;

    border:
        1px solid
        rgba(90,166,235,.25);

    background:
        rgba(7,17,27,.55);

    clip-path:
        polygon(
            8px 0,
            100% 0,
            100% calc(100% - 8px),
            calc(100% - 8px) 100%,
            0 100%,
            0 8px
        );
}


.music-name{

    display:block;

    margin-bottom:11px;

    font-size:9px;

    letter-spacing:.15em;

    color:
        rgba(170,205,230,.65);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.music-controls{

    display:flex;

    align-items:center;

    gap:8px;
}


.play-button{

    width:25px;
    height:25px;

    border:0;

    background:transparent;

    color:#8fd0ff;

    cursor:pointer;

    font-size:13px;

    padding:0;
}


.volume-slider{

    flex:1;

    min-width:0;

    height:3px;

    appearance:none;
    -webkit-appearance:none;

    background:
        rgba(120,180,220,.35);

    outline:none;

    cursor:pointer;
}

.volume-slider::-webkit-slider-thumb{

    appearance:none;
    -webkit-appearance:none;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#8fd0ff;

    box-shadow:
        0 0 8px
        rgba(100,190,255,.7);
}

.volume-slider::-moz-range-thumb{

    width:9px;
    height:9px;

    border:0;

    border-radius:50%;

    background:#8fd0ff;
}


.mute-button{

    width:24px;
    height:24px;

    border:0;

    background:transparent;

    color:#8fd0ff;

    cursor:pointer;

    font-size:13px;
}


/* =========================================================
   SOCIAL ICONS
========================================================= */

.socials{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:0;

    margin-top:20px;

    padding-top:18px;

    border-top:
        1px solid
        rgba(90,166,235,.25);
}


.social{

    width:42px;
    height:28px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#b9d2e7;

    text-decoration:none;

    font-size:12px;

    font-weight:600;

    letter-spacing:.08em;

    transition:
        color .25s,
        text-shadow .25s,
        transform .25s;
}

.social + .social{

    border-left:
        1px solid
        rgba(90,166,235,.25);
}

.social:hover{

    color:#8fd0ff;

    transform:translateY(-2px);

    text-shadow:
        0 0 13px
        rgba(100,190,255,.7);
}


/* =========================================================
   RIGHT PANEL
========================================================= */

.right-panel{

    position:absolute;

    top:110px;
    right:65px;

    width:
        min(850px,calc(100vw - 370px));

    bottom:100px;

    border:
        1px solid
        rgba(90,166,235,.30);

    background:
        rgba(3,9,15,.52);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    opacity:0;

    transform:
        translateX(45px);

    pointer-events:none;

    transition:
        opacity .4s ease,
        transform .45s cubic-bezier(.77,0,.18,1);

    overflow:hidden;

    clip-path:
        polygon(
            20px 0,
            calc(100% - 20px) 0,
            100% 20px,
            100% calc(100% - 20px),
            calc(100% - 20px) 100%,
            20px 100%,
            0 calc(100% - 20px),
            0 20px
        );
}

.right-panel.open{

    opacity:1;

    transform:
        translateX(0);

    pointer-events:auto;
}


/* =========================================================
   PANEL HEADER
========================================================= */

.panel-header{

    height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    border-bottom:
        1px solid
        rgba(90,166,235,.22);
}

.panel-title{

    font-size:13px;

    letter-spacing:.20em;

    color:#dceeff;
}

	.panel-title-area{

    display:flex;

    align-items:center;

    gap:14px;
}


.folder-button{

    width:28px;
    height:28px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid
        rgba(90,166,235,.32);

    background:
        rgba(5,14,23,.55);

    color:#8fd0ff;

    text-decoration:none;

    transition:
        border-color .25s,
        background .25s,
        color .25s,
        transform .25s,
        box-shadow .25s;
}


.folder-button svg{

    width:14px;
    height:14px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.5;

    stroke-linecap:round;

    stroke-linejoin:round;
}


.folder-button:hover{

    color:#bfe5ff;

    border-color:
        rgba(125,205,255,.75);

    background:
        rgba(40,100,150,.18);

    transform:
        translateY(-1px);

    box-shadow:
        0 0 14px
        rgba(80,170,240,.25);
}

.panel-close{

    border:0;

    background:transparent;

    color:
        rgba(180,210,235,.65);

    font-family:"Oxanium",sans-serif;

    font-size:11px;

    letter-spacing:.12em;

    cursor:pointer;

    transition:
        color .2s;
}

.panel-close:hover{

    color:#fff;
}


/* =========================================================
   PANEL CONTENT
========================================================= */

.panel-content{

    height:
        calc(100% - 72px);

    overflow-y:auto;

    padding:22px;

    scrollbar-width:thin;

    scrollbar-color:
        rgba(100,180,235,.35)
        transparent;
}


/* =========================================================
   CHARACTER GRID
========================================================= */

.character-grid{

    display:grid;

    grid-template-columns:
        repeat(5,minmax(110px,1fr));

    gap:13px;
}


/* =========================================================
   CHARACTER CARD
========================================================= */

.character-item{

    position:relative;

    aspect-ratio:
        .67;

    border:
        1px solid
        rgba(90,160,215,.30);

    background:
        linear-gradient(
            145deg,
            rgba(18,38,57,.48),
            rgba(4,10,16,.75)
        );

    cursor:pointer;

    overflow:hidden;

    padding:0;

    font-family:"Oxanium",sans-serif;

    clip-path:
        polygon(
            9px 0,
            calc(100% - 9px) 0,
            100% 9px,
            100% calc(100% - 9px),
            calc(100% - 9px) 100%,
            9px 100%,
            0 calc(100% - 9px),
            0 9px
        );

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;
}

.character-item.new-row{
    grid-column-start:1;
}

.character-item:hover{

    transform:
        translateY(-4px);

    border-color:
        rgba(125,205,255,.75);

    box-shadow:
        0 0 22px
        rgba(65,155,220,.18);
}


.character-portrait{

    position:absolute;

    inset:0;
}

.character-portrait img{

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center top;

    display:block;

    filter:
        saturate(.88)
        contrast(1.04)
        brightness(.82);

    transition:
        transform .3s,
        filter .3s;
}

.character-item:hover img{

    transform:scale(1.045);

    filter:
        saturate(1)
        contrast(1.06)
        brightness(.96);
}


.character-portrait:after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            transparent 35%,
            rgba(3,8,14,.12) 50%,
            rgba(3,8,14,.88) 100%
        );
}


.character-name{

    position:absolute;

    left:9px;
    right:9px;
    bottom:9px;

    z-index:2;

    font-size:8px;

    line-height:1.3;

    letter-spacing:.08em;

    text-align:left;

    color:#e6f3ff;

    text-shadow:
        0 1px 8px #000;
}


/* =========================================================
   BIO OVERLAY
========================================================= */

.bio-panel{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:30px;

    background:
        rgba(1,5,9,.82);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .3s ease;
}

.bio-panel.open{

    opacity:1;

    pointer-events:auto;
}


.bio-window{

    width:
        min(850px,92vw);

    max-height:82vh;

    position:relative;

    display:grid;

    grid-template-columns:280px 1fr;

    overflow:hidden;

    border:
        1px solid
        rgba(100,183,246,.65);

    background:
        linear-gradient(
            135deg,
            rgba(13,31,48,.97),
            rgba(3,8,14,.99)
        );

    box-shadow:
        0 0 55px
        rgba(55,145,220,.18);

    clip-path:
        polygon(
            24px 0,
            calc(100% - 24px) 0,
            100% 24px,
            100% calc(100% - 24px),
            calc(100% - 24px) 100%,
            24px 100%,
            0 calc(100% - 24px),
            0 24px
        );
}


.bio-image{

    min-height:390px;

    position:relative;

    overflow:hidden;

    border-right:
        1px solid
        rgba(90,166,235,.25);
}

.bio-image img{

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center top;

    display:block;

    filter:
        brightness(.86)
        saturate(.9);
}


.bio-image:after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(3,8,14,.15) 45%,
            rgba(3,8,14,.8)
        );
}


.bio-content{

    padding:42px 44px;

    overflow-y:auto;
}


.bio-label{

    font-size:9px;

    letter-spacing:.28em;

    color:
        rgba(120,180,225,.55);

    margin-bottom:10px;
}


.bio-name{

    font-size:34px;

    line-height:1.1;

    font-weight:600;

    letter-spacing:.08em;

    margin-bottom:24px;
}


.bio-divider{

    width:100%;

    height:1px;

    margin-bottom:25px;

    background:
        linear-gradient(
            90deg,
            rgba(100,183,246,.65),
            transparent
        );
}


.bio-text{

    color:#b8c8d9;

    font-size:14px;

    line-height:1.9;

    letter-spacing:.04em;

    min-height:60px;
}


.bio-stats{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:28px;
}


.bio-stat{

    padding:13px 15px;

    border:
        1px solid
        rgba(86,157,218,.22);

    background:
        rgba(5,12,20,.45);
}


.bio-stat-label{

    display:block;

    font-size:8px;

    letter-spacing:.2em;

    color:
        rgba(120,180,225,.45);

    margin-bottom:5px;
}


.bio-stat-value{

    font-size:12px;

    color:#dceeff;

    letter-spacing:.08em;
}


.bio-close{

    position:absolute;

    top:18px;
    right:20px;

    z-index:5;

    border:
        1px solid
        rgba(100,183,246,.45);

    background:
        rgba(3,8,14,.72);

    color:#dceeff;

    padding:9px 13px;

    font-family:"Oxanium",sans-serif;

    font-size:10px;

    letter-spacing:.16em;

    cursor:pointer;
}


/* =========================================================
   PRESETS
========================================================= */

.presets{

    display:inline-block;

    margin-bottom:18px;

    padding:9px 14px;

    border:
        1px solid
        rgba(100,183,246,.40);

    color:#cfe9ff;

    text-decoration:none;

    font-size:9px;

    letter-spacing:.15em;

    transition:
        background .2s,
        border-color .2s;
}

.presets:hover{

    background:
        rgba(50,110,160,.18);

    border-color:
        rgba(125,205,255,.75);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .frame{
        inset:15px;
    }

    .welcome{

        top:38px;
        right:30px;

        font-size:9px;
    }

    .brand{

        right:30px;
        bottom:35px;

        font-size:24px;
    }

    .navigation{

        left:30px;

        width:200px;

        padding:22px 20px;
    }

    .right-panel{

        top:100px;

        right:25px;

        width:
            calc(100vw - 270px);

        bottom:80px;
    }

    .character-grid{

        grid-template-columns:
            repeat(3,1fr);

        gap:8px;
    }

}


@media(max-width:600px){

    .welcome{

        top:32px;
        right:25px;

        font-size:8px;

        letter-spacing:.15em;
    }

    .navigation{

        left:20px;

        top:auto;
        bottom:55px;

        transform:none;

        width:185px;

        padding:18px;
    }

    .nav-button{

        font-size:11px;

        padding:9px 3px;
    }

    .social{

        width:35px;

        font-size:10px;
    }

    .brand{

        right:25px;
        bottom:28px;

        font-size:20px;
    }

    .right-panel{

        top:90px;
        right:20px;
        left:20px;

        width:auto;

        bottom:310px;
    }

    .panel-header{

        height:55px;

        padding:0 16px;
    }

    .panel-title{

        font-size:10px;
    }

    .panel-content{

        padding:12px;
    }

    .character-grid{

        grid-template-columns:
            repeat(3,1fr);
    }

    .bio-window{

        width:95vw;

        max-height:88vh;

        grid-template-columns:1fr;

        grid-template-rows:220px 1fr;
    }

    .bio-image{

        min-height:0;

        border-right:0;

        border-bottom:
            1px solid
            rgba(90,166,235,.25);
    }

    .bio-content{

        padding:25px;
    }

    .bio-name{

        font-size:24px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

        "--move-x",

        "--move-y",
        (Math.random() * 80 - 40) + "px"
    );

    particle.style.setProperty(
        "--duration",
        (5 + Math.random() * 8) + "s"
    );

    particle.style.setProperty(
        "--blink",
        (2 + Math.random() * 5) + "s"
    );

    "click",
    function(){

        const open =
            musicSection.classList.toggle(
                "open"

        musicButton.classList.toggle(
            "active",
            open
        );

        musicArrow.textContent =
            open ? "⌄" : ">";

		if(open && !isPlaying){

            playMusic();

		}

    }
);


/* PLAY */

function playMusic(){

    music.play()
        .then(function(){

            isPlaying = true;

            playButton.textContent =
                "❚❚";

        })
        .catch(function(){

            isPlaying = false;

        });

}


function pauseMusic(){

    music.pause();

    isPlaying = false;

    playButton.textContent =
        "▶";

}


playButton.addEventListener(
    "click",
    function(){

        if(isPlaying){

            pauseMusic();

        }
        else{

            playMusic();

        }

    }
);


/* MUTE */

muteButton.addEventListener(
    "click",
    function(){

        if(isMuted){

            music.muted = false;

            muteButton.textContent =
                "🔊";

            isMuted = false;

        }
        else{

            music.muted = true;

            muteButton.textContent =
                "🔇";

            isMuted = true;

        }

    }
);


/* VOLUME */

volumeSlider.addEventListener(
    "input",
    function(){

        const volume =
            Number(this.value) / 100;

        music.volume =
            volume;

        if(volume === 0){

            music.muted = true;

            muteButton.textContent =
                "🔇";

            isMuted = true;

        }
        else{

            music.muted = false;

/* =========================================================
   IMAGE NAME
========================================================= */

function getImageName(name){

    return name
        .toLowerCase()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-|-$/g,
            ""
        );

}


/* =========================================================
   OPEN RIGHT PANEL
========================================================= */

function openPanel(type){

    currentPanel = type;

    characterButton.classList.remove(
        "active"
    );

    aboutButton.classList.remove(
        "active"
    );


    if(type === "character"){

        characterButton.classList.add(
            "active"
        );

        panelTitle.textContent =
            "CHARACTER";

		folderButton.style.display = "flex";

        buildCharacterGrid();

    }


    if(type === "about"){

        aboutButton.classList.add(
            "active"
        );

        panelTitle.textContent =
            "";

		folderButton.style.display = 
			"none";

        /*
         * INTENTIONALLY BLANK.
         *
         * ABOUT PANEL HAS NO CONTENT.
         */

        panelContent.innerHTML =
            "";

    }


    rightPanel.classList.add(
        "open"
    );

    rightPanel.setAttribute(
        "aria-hidden",
        "false"
    );

}


/* =========================================================
   CLOSE PANEL
========================================================= */

function closePanel(){

    currentPanel = null;

    rightPanel.classList.remove(
        "open"
    );

    characterButton.classList.remove(
        "active"
    );

    aboutButton.classList.remove(
        "active"
    );

    rightPanel.setAttribute(
        "aria-hidden",
        "true"
    );

}


/* =========================================================
   CHARACTER GRID
========================================================= */

function buildCharacterGrid(){

    panelContent.innerHTML = "";


    const grid =
        document.createElement(
            "div"
        );

    grid.className =
        "character-grid";


    characters.forEach(
        function(name){

            const card =
                document.createElement(
                    "button"
                );

            card.type =
                "button";

            card.className =
                "character-item";

	    if(name === "Kouka Arisato"){
		    card.classList.add("new-row");
		}


            const imageName =
                getImageName(name);


            card.innerHTML = `

                <span class="character-portrait">

                    <img
                        src="images/${imageName}.png"
                        alt="${name}"
                        loading="lazy"
                    >

                </span>

                <span class="character-name">
                    ${name}
                </span>

            `;


            const image =
                card.querySelector("img");


            image.addEventListener(
                "error",
                function(){

                    this.style.display =
                        "none";

                }
            );


            card.addEventListener(
                "click",
                function(){

                    openBio(name);

                }
            );


            grid.appendChild(card);

        }
    );


    panelContent.appendChild(grid);

}

            event.key === "Escape"

            if(

            ){

                closeBioPanel();

                return;

            }


            if(
                rightPanel.classList.contains(
                    "open"
                )

            }

        }

    }
);


/* =========================================================
   UNIVERSAL CLICK SOUND
========================================================= */

const clickSound =
    new Audio(
        "audio/button-click.mp3"
    );

clickSound.preload =
    "auto";


document.addEventListener(
    "click",
    function(event){

        const target =
            event.target;

        if(
            !(target instanceof Element)
        ){

            return;

        }


        const clickable =
            target.closest(
                "button, a"
            );


        if(!clickable){

            return;

        }


        /*
         * Don't interfere with
         * external links.
         */

        clickSound.currentTime = 0;

        clickSound
            .play()
            .catch(
                function(){}
            );

    },
    true
);

         * autoplay.
