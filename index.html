<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>dex-3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASIC
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#03060a;
    color:#f4f8ff;
    font-family:"Oxanium",sans-serif;
    overflow:hidden;
}


/* =========================================================
   ANIMATED BACKGROUND
   ========================================================= */

.background{
    position:fixed;
    inset:-80px;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.grid{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(45,86,125,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(45,86,125,.055) 1px,
            transparent 1px
        );

    background-size:72px 72px;

    animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
    from{
        background-position:0 0,0 0;
    }

    to{
        background-position:72px 72px,72px 72px;
    }
}

.glow{
    position:absolute;

    width:65vw;
    height:65vw;

    max-width:850px;
    max-height:850px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(42,76,115,.18) 0%,
            rgba(42,76,115,.10) 22%,
            rgba(42,76,115,.035) 42%,
            transparent 70%
        );

    filter:blur(5px);

    animation:glowMove 14s ease-in-out infinite alternate;
}

@keyframes glowMove{

    0%{
        transform:translate(-54%,-48%) scale(.95);
    }

    50%{
        transform:translate(-46%,-53%) scale(1.05);
    }

    100%{
        transform:translate(-51%,-45%) scale(.98);
    }
}

.diagonal-light{
    position:absolute;
    inset:-100%;

    background:
        linear-gradient(
            135deg,
            transparent 0 46%,
            rgba(80,150,220,.045) 46.1% 46.2%,
            transparent 46.3%
        );

    animation:diagonalMove 22s linear infinite;
}

@keyframes diagonalMove{

    0%{
        transform:translate(-2%,-2%);
    }

    50%{
        transform:translate(2%,2%);
    }

    100%{
        transform:translate(-2%,-2%);
    }
}

.scanline{
    position:absolute;

    width:100%;
    height:1px;

    top:-10%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(100,180,240,.10),
            transparent
        );

    animation:scan 10s linear infinite;
}

@keyframes scan{

    0%{
        top:-10%;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    100%{
        top:110%;
        opacity:0;
    }
}


/* =========================================================
   PARTICLES
   ========================================================= */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:rgba(130,200,255,.5);

    box-shadow:
        0 0 8px rgba(100,190,255,.35);

    animation:
        particleFloat var(--duration) ease-in-out infinite alternate,
        particleBlink var(--blink) ease-in-out infinite;
}

@keyframes particleFloat{

    from{
        transform:translate(0,0);
    }

    to{
        transform:
            translate(
                var(--move-x),
                var(--move-y)
            );
    }
}

@keyframes particleBlink{

    0%,100%{
        opacity:.15;
    }

    50%{
        opacity:.8;
    }
}


/* =========================================================
   LANDING PAGE
   ========================================================= */

.page{
    width:100%;
    height:100vh;
    min-height:620px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;
    z-index:2;

    transition:
        transform .9s cubic-bezier(.77,0,.18,1),
        opacity .7s ease;
}

body.profile-open .page{
    transform:translateY(12vh) scale(.97);
    opacity:0;
    pointer-events:none;
}


/* =========================================================
   CORNERS
   ========================================================= */

.page:before,
.page:after{
    content:"";

    position:absolute;

    width:46px;
    height:46px;

    border-color:rgba(90,166,235,.55);

    pointer-events:none;
}

.page:before{
    top:30px;
    left:30px;

    border-top:1px solid;
    border-left:1px solid;
}

.page:after{
    right:30px;
    bottom:30px;

    border-right:1px solid;
    border-bottom:1px solid;
}

.corner{
    position:absolute;

    font-size:8px;

    letter-spacing:.28em;

    color:rgba(105,173,232,.55);

    text-transform:uppercase;
}

.top-left{
    top:54px;
    left:60px;
}

.top-right{
    top:54px;
    right:60px;
}

.bottom-left{
    bottom:54px;
    left:60px;
}

.bottom-right{
    bottom:54px;
    right:60px;
}


/* =========================================================
   LOGO
   ========================================================= */

.logo{
    font-size:clamp(54px,8vw,100px);

    line-height:1;

    font-weight:600;

    letter-spacing:-.07em;

    text-shadow:
        0 0 28px rgba(110,180,255,.25);

    margin-bottom:38px;

    animation:
        logoGlow 5s ease-in-out infinite alternate;
}

@keyframes logoGlow{

    0%{
        text-shadow:
            0 0 20px rgba(110,180,255,.18);
    }

    100%{
        text-shadow:
            0 0 34px rgba(110,180,255,.38);
    }
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider{
    width:360px;
    max-width:65vw;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(102,177,242,.65),
            transparent
        );

    position:relative;

    margin-bottom:34px;
}

.divider:after{
    content:"///";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-54%);

    padding:0 12px;

    background:#05080d;

    color:#6cb9f5;

    font-size:10px;
}


/* =========================================================
   FOLLOW
   ========================================================= */

.follow{
    font-size:12px;

    letter-spacing:.22em;

    color:#b8c8d9;

    text-transform:uppercase;

    margin-bottom:28px;
}


/* =========================================================
   SOCIALS
   ========================================================= */

.socials{
    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:64px;

    border-left:
        1px solid rgba(86,157,218,.45);

    border-right:
        1px solid rgba(86,157,218,.45);

    padding:7px 24px;
}

.socials a{
    color:#eef6ff;

    text-decoration:none;

    font-size:12px;

    font-weight:500;

    letter-spacing:.2em;

    padding:0 28px;

    transition:
        color .25s,
        text-shadow .25s,
        transform .25s;
}

.socials a+a{
    border-left:
        1px solid rgba(86,157,218,.35);
}

.socials a:hover{
    color:#8fd0ff;

    text-shadow:
        0 0 14px rgba(96,183,255,.7);

    transform:translateY(-1px);
}


/* =========================================================
   CHARACTER PROFILE BUTTON
   ========================================================= */

.profile{
    min-width:340px;

    padding:18px 44px;

    border:
        1px solid rgba(100,183,246,.75);

    color:#f4f8ff;

    text-decoration:none;

    position:relative;

    cursor:pointer;

    font-family:"Oxanium",sans-serif;

    clip-path:
        polygon(
            18px 0,
            calc(100% - 18px) 0,
            100% 18px,
            100% calc(100% - 18px),
            calc(100% - 18px) 100%,
            18px 100%,
            0 calc(100% - 18px),
            0 18px
        );

    background:
        rgba(5,12,20,.42);

    transition:
        background .25s,
        box-shadow .25s,
        transform .25s;
}

.profile:hover{
    background:
        rgba(40,91,135,.18);

    box-shadow:
        0 0 28px rgba(67,157,225,.16);

    transform:translateY(-2px);
}

.profile-text{
    font-size:12px;

    font-weight:600;

    letter-spacing:.24em;
}

.triangle{
    display:block;

    margin-top:14px;

    color:#8bcfff;

    font-size:13px;

    transition:
        transform .3s,
        text-shadow .3s;
}

.profile:hover .triangle{
    transform:translateY(5px);

    text-shadow:
        0 0 12px rgba(110,195,255,.9);
}


/* =========================================================
   STATUS
   ========================================================= */

.status{
    position:absolute;

    bottom:38px;
    left:50%;

    transform:translateX(-50%);

    font-size:7px;

    letter-spacing:.28em;

    color:rgba(120,177,218,.42);

    text-transform:uppercase;
}


/* =========================================================
   CHARACTER SCREEN
   ========================================================= */

.character-screen{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100vh;

    z-index:10;

    background:
        linear-gradient(
            rgba(3,8,14,.88),
            rgba(3,8,14,.96)
        );

    transform:translateY(-100%);

    opacity:0;

    transition:
        transform .9s cubic-bezier(.77,0,.18,1),
        opacity .65s ease;

    overflow:hidden;

    pointer-events:none;
}

body.profile-open .character-screen{

    transform:translateY(0);

    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   CHARACTER HEADER
   ========================================================= */

.character-header{

    position:absolute;

    top:0;
    left:0;

    width:100%;

    height:100px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 60px;

    border-bottom:
        1px solid rgba(86,157,218,.30);

    background:
        rgba(3,8,14,.55);

    backdrop-filter:blur(8px);

    -webkit-backdrop-filter:blur(8px);

    z-index:5;
}

.character-title{

    display:flex;

    flex-direction:column;

    align-items:flex-start;
}

.character-title-main{

    font-size:24px;

    font-weight:600;

    letter-spacing:.12em;
}

.character-title-sub{

    margin-top:6px;

    font-size:8px;

    letter-spacing:.28em;

    color:
        rgba(120,180,225,.55);
}


/* =========================================================
   CLOSE
   ========================================================= */

.close-profile{

    border:
        1px solid rgba(100,183,246,.55);

    background:
        rgba(5,12,20,.5);

    color:#dceeff;

    padding:
        10px 18px;

    font-family:"Oxanium",sans-serif;

    font-size:9px;

    letter-spacing:.20em;

    cursor:pointer;

    transition:
        background .25s,
        color .25s,
        box-shadow .25s;
}

.close-profile:hover{

    color:#fff;

    background:
        rgba(40,91,135,.25);

    box-shadow:
        0 0 18px rgba(67,157,225,.18);
}


/* =========================================================
   CHARACTER SELECT AREA
   ========================================================= */

.character-select{

    position:absolute;

    left:0;
    right:0;

    top:100px;
    bottom:0;

    padding:
        24px 50px 30px;

    display:flex;

    flex-direction:column;

    align-items:center;

    overflow:hidden;
}


/* =========================================================
   SELECT HEADER
   ========================================================= */

.select-heading{

    text-align:center;

    flex-shrink:0;

    margin-bottom:14px;
}

.select-heading-main{

    font-size:13px;

    font-weight:500;

    letter-spacing:.28em;

    color:#dceeff;
}

.select-heading-sub{

    display:block;

    margin-top:5px;

    font-size:7px;

    letter-spacing:.20em;

    color:
        rgba(120,180,225,.42);
}


/* =========================================================
   CHARACTER GRID
   ========================================================= */

.character-grid{

    width:min(1050px,90vw);

    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    grid-auto-rows:1fr;

    gap:7px;

    align-content:center;

}


/* =========================================================
   CHARACTER SLOT
   ========================================================= */

.character-item{

    min-width:0;
    min-height:0;

    position:relative;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-end;

    padding:5px;

    border:
        1px solid rgba(90,160,215,.25);

    background:
        linear-gradient(
            145deg,
            rgba(18,38,57,.48),
            rgba(4,10,16,.68)
        );

    color:#dceeff;

    font-family:"Oxanium",sans-serif;

    cursor:pointer;

    overflow:hidden;

    clip-path:
        polygon(
            8px 0,
            calc(100% - 8px) 0,
            100% 8px,
            100% calc(100% - 8px),
            calc(100% - 8px) 100%,
            8px 100%,
            0 calc(100% - 8px),
            0 8px
        );

    transition:
        transform .2s,
        border-color .2s,
        background .2s,
        box-shadow .2s;
}

.character-item:hover{

    transform:
        translateY(-4px)
        scale(1.025);

    border-color:
        rgba(125,205,255,.70);

    background:
        linear-gradient(
            145deg,
            rgba(32,72,103,.55),
            rgba(5,14,22,.75)
        );

    box-shadow:
        0 0 18px rgba(65,155,220,.18);
}


/* Selected */

.character-item.active{

    border-color:
        rgba(135,215,255,.95);

    background:
        linear-gradient(
            145deg,
            rgba(38,88,125,.58),
            rgba(5,14,22,.82)
        );

    box-shadow:
        0 0 22px rgba(65,170,240,.25),
        inset 0 0 18px rgba(90,180,240,.08);
}

.character-item.active:after{

    content:"";

    position:absolute;

    inset:3px;

    border:
        1px solid rgba(140,220,255,.28);

    pointer-events:none;
}


/* =========================================================
   PORTRAIT PLACEHOLDER
   ========================================================= */

.character-portrait{

    position:absolute;

    left:8px;
    right:8px;

    top:8px;
    bottom:32px;

    border:
        1px solid rgba(90,160,215,.16);

    background:
        radial-gradient(
            circle at center,
            rgba(70,135,180,.12),
            rgba(3,8,14,.20) 60%,
            transparent 75%
        );

    display:flex;

    align-items:center;
    justify-content:center;
}

.character-portrait:before{

    content:"PORTRAIT";

    font-size:6px;

    letter-spacing:.18em;

    color:
        rgba(140,195,230,.22);
}


/* Character number */

.character-number{

    position:absolute;

    top:7px;
    left:9px;

    z-index:2;

    font-size:7px;

    letter-spacing:.12em;

    color:
        rgba(130,195,235,.55);
}


/* Character name */

.character-name{

    position:relative;

    z-index:3;

    width:100%;

    padding:
        7px 3px 4px;

    background:
        linear-gradient(
            transparent,
            rgba(3,8,14,.92) 35%
        );

    font-size:7px;

    letter-spacing:.06em;

    line-height:1.1;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   SELECTED CHARACTER DISPLAY
   ========================================================= */

.selected-display{

    width:min(700px,70vw);

    height:66px;

    flex-shrink:0;

    margin-top:13px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    border-top:
        1px solid rgba(100,183,246,.28);

    border-bottom:
        1px solid rgba(100,183,246,.28);

    background:
        rgba(4,12,20,.34);
}

.selected-display:before,
.selected-display:after{

    content:"";

    position:absolute;

    width:22px;
    height:22px;

    border-color:
        rgba(100,183,246,.60);
}

.selected-display:before{

    left:0;
    top:0;

    border-top:1px solid;
    border-left:1px solid;
}

.selected-display:after{

    right:0;
    bottom:0;

    border-right:1px solid;
    border-bottom:1px solid;
}

.selected-info{

    text-align:center;
}

.selected-number{

    display:block;

    font-size:6px;

    letter-spacing:.25em;

    color:
        rgba(120,190,235,.50);

    margin-bottom:4px;
}

.selected-name{

    display:block;

    font-size:20px;

    font-weight:500;

    letter-spacing:.10em;

    text-shadow:
        0 0 18px rgba(100,190,255,.22);
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.character-navigation{

    position:absolute;

    left:50%;

    bottom:13px;

    transform:translateX(-50%);

    display:flex;

    align-items:center;

    gap:15px;

    z-index:10;
}

.nav-character{

    border:0;

    background:transparent;

    color:
        rgba(145,205,245,.70);

    font-family:"Oxanium",sans-serif;

    font-size:8px;

    letter-spacing:.20em;

    cursor:pointer;

    padding:5px 10px;

    transition:
        color .2s,
        text-shadow .2s;
}

.nav-character:hover{

    color:#fff;

    text-shadow:
        0 0 10px rgba(100,190,255,.7);
}

.nav-separator{

    width:1px;

    height:15px;

    background:
        rgba(100,183,246,.30);
}


/* =========================================================
   COUNTER
   ========================================================= */

.character-counter{

    position:absolute;

    bottom:18px;

    right:50px;

    font-size:7px;

    letter-spacing:.20em;

    color:
        rgba(120,180,225,.45);
}


/* =========================================================
   MUSIC
   ========================================================= */

.music-control{

    position:fixed;

    right:34px;
    bottom:30px;

    z-index:30;

    display:flex;

    align-items:center;

    gap:10px;

    padding:7px 10px;

    border:
        1px solid rgba(90,166,235,.35);

    background:
        rgba(3,8,14,.72);

    backdrop-filter:blur(8px);

    -webkit-backdrop-filter:blur(8px);

    clip-path:
        polygon(
            8px 0,
            100% 0,
            100% calc(100% - 8px),
            calc(100% - 8px) 100%,
            0 100%,
            0 8px
        );
}

.music-button{

    width:28px;
    height:24px;

    border:0;

    background:transparent;

    color:#8fd0ff;

    font-family:"Oxanium",sans-serif;

    font-size:12px;

    cursor:pointer;

    transition:
        color .2s,
        text-shadow .2s;
}

.music-button:hover{

    color:#fff;

    text-shadow:
        0 0 10px rgba(100,190,255,.8);
}

.volume-slider{

    width:70px;

    appearance:none;
    -webkit-appearance:none;

    height:2px;

    background:
        rgba(120,180,220,.35);

    outline:none;

    cursor:pointer;
}

.volume-slider::-webkit-slider-thumb{

    appearance:none;
    -webkit-appearance:none;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#8fd0ff;

    box-shadow:
        0 0 8px rgba(100,190,255,.8);
}

.volume-slider::-moz-range-thumb{

    width:8px;
    height:8px;

    border:none;

    border-radius:50%;

    background:#8fd0ff;

    box-shadow:
        0 0 8px rgba(100,190,255,.8);
}

.music-label{

    font-size:7px;

    letter-spacing:.18em;

    color:
        rgba(140,190,225,.55);

    user-select:none;
}

audio{
    display:none;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px){

    .character-grid{

        grid-template-columns:
            repeat(5,1fr);

        width:92vw;

        gap:5px;
    }

    .character-name{

        font-size:6px;
    }
}

@media(max-width:600px){

    .page{

        min-height:560px;

        padding:0 20px;
    }

    .corner{

        display:none;
    }

    .logo{

        font-size:58px;

        margin-bottom:30px;
    }

    .follow{

        font-size:9px;

        letter-spacing:.14em;

        max-width:90vw;

        line-height:1.8;
    }

    .socials{

        padding:6px 5px;

        margin-bottom:50px;
    }

    .socials a{

        font-size:9px;

        padding:0 11px;

        letter-spacing:.12em;
    }

    .profile{

        min-width:min(330px,88vw);

        padding:17px 25px;
    }

    .profile-text{

        font-size:10px;

        letter-spacing:.18em;
    }

    .status{

        bottom:22px;
    }

    .music-control{

        right:16px;

        bottom:16px;
    }

    .music-label{

        display:none;
    }


    /* Character screen */

    .character-header{

        height:76px;

        padding:
            0 18px;
    }

    .character-title-main{

        font-size:15px;
    }

    .character-title-sub{

        font-size:5px;
    }

    .close-profile{

        padding:
            8px 11px;

        font-size:7px;
    }

    .character-select{

        top:76px;

        padding:
            16px 12px 20px;
    }

    .select-heading{

        margin-bottom:10px;
    }

    .select-heading-main{

        font-size:10px;
    }

    .select-heading-sub{

        font-size:5px;
    }

    .character-grid{

        width:100%;

        grid-template-columns:
            repeat(4,1fr);

        grid-template-rows:
            repeat(7,1fr);

        gap:4px;
    }

    .character-item{

        padding:3px;
    }

    .character-portrait{

        left:4px;
        right:4px;

        top:4px;
        bottom:25px;
    }

    .character-number{

        top:4px;
        left:5px;

        font-size:5px;
    }

    .character-name{

        font-size:5px;

        padding:
            5px 2px 3px;
    }

    .selected-display{

        width:100%;

        height:52px;

        margin-top:8px;
    }

    .selected-number{

        font-size:5px;

        margin-bottom:2px;
    }

    .selected-name{

        font-size:15px;
    }

    .character-navigation{

        bottom:5px;
    }

    .nav-character{

        font-size:6px;

        padding:3px 7px;
    }

    .character-counter{

        right:15px;

        bottom:8px;

        font-size:5px;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     BACKGROUND
     ======================================================= -->

<div class="background">

    <div class="grid"></div>

    <div class="glow"></div>

    <div class="diagonal-light"></div>

    <div class="scanline"></div>

    <div
        class="particles"
        id="particles">
    </div>

</div>


<!-- =======================================================
     LOCAL MUSIC
     ======================================================= -->

<audio
    id="backgroundMusic"
    loop
    preload="auto"
>
    <source
        src="audio/background.mp3"
        type="audio/mpeg"
    >

    Your browser does not support the audio element.
</audio>


<!-- =======================================================
     LANDING PAGE
     ======================================================= -->

<main class="page">

    <span class="corner top-left">
        DEX-3 // PORTAL
    </span>

    <span class="corner top-right">
        SYSTEM ONLINE
    </span>

    <span class="corner bottom-left">
        ACCESS POINT
    </span>

    <span class="corner bottom-right">
        V1.0.0
    </span>


    <h1 class="logo">
        dex-3
    </h1>


    <div class="divider"></div>


    <p class="follow">
        Be sure to follow me on this platform!
    </p>


    <nav
        class="socials"
        aria-label="Social media"
    >

        <a
            href="https://x.com/sorawindy"
            target="_blank"
            rel="noopener noreferrer"
        >
            Twitter
        </a>

        <a
            href="https://www.pixiv.net/en/users/50033895"
            target="_blank"
            rel="noopener noreferrer"
        >
            Pixiv
        </a>

        <a
            href="https://www.deviantart.com/dex-3"
            target="_blank"
            rel="noopener noreferrer"
        >
            DeviantArt
        </a>

    </nav>


    <button
        class="profile"
        id="openProfile"
        type="button"
        aria-label="Open Character Profile"
    >

        <span class="profile-text">
            CHARACTER PROFILE
        </span>

        <span class="triangle">
            ▼
        </span>

    </button>


    <span class="status">
        PERSONAL CREATIVE PORTAL
    </span>

</main>


<!-- =======================================================
     CHARACTER SELECT SCREEN
     ======================================================= -->

<section
    class="character-screen"
    id="characterScreen"
    aria-hidden="true"
>


    <!-- HEADER -->

    <header class="character-header">

        <div class="character-title">

            <span class="character-title-main">
                CHARACTER PROFILE
            </span>

            <span class="character-title-sub">
                CHARACTER DATABASE // 26 ENTRIES
            </span>

        </div>


        <button
            class="close-profile"
            id="closeProfile"
            type="button"
        >
            CLOSE ×
        </button>

    </header>


    <!-- CHARACTER SELECT -->

    <div class="character-select">


        <div class="select-heading">

            <span class="select-heading-main">
                CHARACTER SELECT
            </span>

            <span class="select-heading-sub">
                SELECT A CHARACTER
            </span>

        </div>


        <!-- CHARACTER GRID -->

        <div
            class="character-grid"
            id="characterGrid"
        >

            <!-- Generated by JavaScript -->

        </div>


        <!-- SELECTED CHARACTER -->

        <div class="selected-display">

            <div class="selected-info">

                <span
                    class="selected-number"
                    id="selectedNumber"
                >
                    CHARACTER 01
                </span>

                <span
                    class="selected-name"
                    id="selectedName"
                >
                    RION ADACHI
                </span>

            </div>

        </div>


    </div>


    <!-- PREVIOUS / NEXT -->

    <div class="character-navigation">

        <button
            class="nav-character"
            id="previousCharacter"
            type="button"
        >
            ◀ PREVIOUS
        </button>

        <span class="nav-separator"></span>

        <button
            class="nav-character"
            id="nextCharacter"
            type="button"
        >
            NEXT ▶
        </button>

    </div>


    <!-- COUNTER -->

    <div
        class="character-counter"
        id="characterCounter"
    >
        01 / 26
    </div>


</section>


<!-- =======================================================
     MUSIC CONTROLS
     ======================================================= -->

<div class="music-control">

    <span class="music-label">
        MUSIC
    </span>


    <button
        class="music-button"
        id="muteButton"
        type="button"
        aria-label="Mute music"
        title="Mute / Unmute"
    >
        🔊
    </button>


    <input
        class="volume-slider"
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        value="35"
        aria-label="Music volume"
        title="Volume"
    >

</div>


<script>

/* =========================================================
   PARTICLES
   ========================================================= */

const particleContainer =
    document.getElementById("particles");

const particleCount =
    window.innerWidth <= 600 ? 20 : 35;

for(let i = 0; i < particleCount; i++){

    const particle =
        document.createElement("span");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        Math.random() * 100 + "%";

    particle.style.setProperty(
        "--move-x",
        (Math.random() * 80 - 40) + "px"
    );

    particle.style.setProperty(
        "--move-y",
        (Math.random() * 80 - 40) + "px"
    );

    particle.style.setProperty(
        "--duration",
        (5 + Math.random() * 8) + "s"
    );

    particle.style.setProperty(
        "--blink",
        (2 + Math.random() * 5) + "s"
    );

    particle.style.animationDelay =
        (-Math.random() * 8) + "s";

    particleContainer.appendChild(
        particle
    );
}


/* =========================================================
   MOUSE PARALLAX
   ========================================================= */

let mouseX = 0;
let mouseY = 0;

let targetX = 0;
let targetY = 0;

document.addEventListener(
    "mousemove",
    function(event){

        targetX =
            (event.clientX / window.innerWidth - 0.5)
            * 12;

        targetY =
            (event.clientY / window.innerHeight - 0.5)
            * 8;

    }
);


function animateParallax(){

    mouseX +=
        (targetX - mouseX) * 0.035;

    mouseY +=
        (targetY - mouseY) * 0.035;

    requestAnimationFrame(
        animateParallax
    );
}

animateParallax();


/* =========================================================
   MUSIC
   ========================================================= */

const music =
    document.getElementById(
        "backgroundMusic"
    );

const muteButton =
    document.getElementById(
        "muteButton"
    );

const volumeSlider =
    document.getElementById(
        "volumeSlider"
    );

let isMuted = false;

music.volume =
    Number(volumeSlider.value) / 100;


function startMusic(){

    music.play().catch(function(){

        /* Browser autoplay restriction */

    });

}

startMusic();


function firstInteraction(){

    startMusic();

    document.removeEventListener(
        "click",
        firstInteraction
    );

    document.removeEventListener(
        "keydown",
        firstInteraction
    );

    document.removeEventListener(
        "pointerdown",
        firstInteraction
    );

    document.removeEventListener(
        "touchstart",
        firstInteraction
    );
}


document.addEventListener(
    "click",
    firstInteraction
);

document.addEventListener(
    "keydown",
    firstInteraction
);

document.addEventListener(
    "pointerdown",
    firstInteraction
);

document.addEventListener(
    "touchstart",
    firstInteraction
);


/* Mute */

muteButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        if(isMuted){

            music.muted = false;

            muteButton.textContent =
                "🔊";

            muteButton.setAttribute(
                "aria-label",
                "Mute music"
            );

            isMuted = false;

            startMusic();

        }else{

            music.muted = true;

            muteButton.textContent =
                "🔇";

            muteButton.setAttribute(
                "aria-label",
                "Unmute music"
            );

            isMuted = true;
        }

    }
);


/* Volume */

volumeSlider.addEventListener(
    "input",
    function(){

        const volume =
            Number(this.value) / 100;

        music.volume =
            volume;

        if(volume === 0){

            music.muted = true;

            muteButton.textContent =
                "🔇";

            isMuted = true;

        }else{

            music.muted = false;

            muteButton.textContent =
                "🔊";

            isMuted = false;

        }

    }
);


/* =========================================================
   26 CHARACTER ROSTER
   ========================================================= */

const characters = [

    "Rion Adachi",
    "Ayami Karasuma",
    "Elsa von Rietveld",
    "Raeda Baxley",
    "Alina Engel",
    "Nova Meledyne",
    "Kiyoko Karasu",
    "Yuzu Irumi",
    "Ro-Eun Yeong",
    "Kouka Arisato",
    "Claudine Celesta",
    "Fia Andini",
    "Finley Camelia",
    "Yume Izumi",
    "Milica Belic",
    "Jasmine Lavenza",
    "Mayumi Inoue",
    "Ethyln Bernard",
    "Diane Cerezyna Tsoi",
    "Vera Rochester",
    "Kira Marinka Orlova",
    "Naomi Tausend",
    "Eimi Shimizu",
    "Lin Hua Ying",
    "Randall Gray",
    "Mai Habara"

];


let currentCharacter = 0;


/* =========================================================
   CHARACTER SELECT ELEMENTS
   ========================================================= */

const characterGrid =
    document.getElementById(
        "characterGrid"
    );

const selectedName =
    document.getElementById(
        "selectedName"
    );

const selectedNumber =
    document.getElementById(
        "selectedNumber"
    );

const characterCounter =
    document.getElementById(
        "characterCounter"
    );


/* =========================================================
   CREATE CHARACTER SLOTS
   ========================================================= */

characters.forEach(
    function(name,index){

        const item =
            document.createElement(
                "button"
            );

        item.className =
            "character-item";

        item.type =
            "button";

        item.setAttribute(
            "aria-label",
            "Select " + name
        );


        item.innerHTML = `

            <span class="character-number">
                ${String(index + 1).padStart(2,"0")}
            </span>

            <span class="character-portrait"></span>

            <span class="character-name">
                ${name}
            </span>

        `;


        item.addEventListener(
            "click",
            function(){

                selectCharacter(index);

            }
        );


        characterGrid.appendChild(
            item
        );

    }
);


/* =========================================================
   SELECT CHARACTER
   ========================================================= */

function selectCharacter(index){

    currentCharacter =
        index;


    const name =
        characters[currentCharacter];


    selectedName.textContent =
        name.toUpperCase();


    selectedNumber.textContent =
        "CHARACTER " +
        String(currentCharacter + 1)
            .padStart(2,"0");


    characterCounter.textContent =
        String(currentCharacter + 1)
            .padStart(2,"0")
        +
        " / "
        +
        String(characters.length)
            .padStart(2,"0");


    const items =
        document.querySelectorAll(
            ".character-item"
        );


    items.forEach(
        function(item,i){

            item.classList.toggle(
                "active",
                i === currentCharacter
            );

        }
    );

}


/* =========================================================
   PREVIOUS
   ========================================================= */

document
    .getElementById(
        "previousCharacter"
    )
    .addEventListener(
        "click",
        function(){

            currentCharacter--;

            if(currentCharacter < 0){

                currentCharacter =
                    characters.length - 1;

            }

            selectCharacter(
                currentCharacter
            );

        }
    );


/* =========================================================
   NEXT
   ========================================================= */

document
    .getElementById(
        "nextCharacter"
    )
    .addEventListener(
        "click",
        function(){

            currentCharacter++;

            if(
                currentCharacter >=
                characters.length
            ){

                currentCharacter = 0;

            }

            selectCharacter(
                currentCharacter
            );

        }
    );


/* =========================================================
   INITIAL CHARACTER
   ========================================================= */

selectCharacter(0);


/* =========================================================
   OPEN CHARACTER SCREEN
   ========================================================= */

const openProfile =
    document.getElementById(
        "openProfile"
    );

const closeProfile =
    document.getElementById(
        "closeProfile"
    );

const characterScreen =
    document.getElementById(
        "characterScreen"
    );


openProfile.addEventListener(
    "click",
    function(){

        document.body.classList.add(
            "profile-open"
        );

        characterScreen.setAttribute(
            "aria-hidden",
            "false"
        );

    }
);


/* =========================================================
   CLOSE CHARACTER SCREEN
   ========================================================= */

closeProfile.addEventListener(
    "click",
    function(){

        document.body.classList.remove(
            "profile-open"
        );

        characterScreen.setAttribute(
            "aria-hidden",
            "true"
        );

    }
);


/* =========================================================
   ESCAPE KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            document.body.classList.contains(
                "profile-open"
            )
        ){

            document.body.classList.remove(
                "profile-open"
            );

            characterScreen.setAttribute(
                "aria-hidden",
                "true"
            );

        }

    }
);

</script>

</body>
</html>
