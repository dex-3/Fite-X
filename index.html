<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>dex-3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#03060a;
    color:#f4f8ff;
    font-family:"Oxanium",sans-serif;
    overflow:hidden;
}


/* =========================================================
   MOVING BACKGROUND
   ========================================================= */

.background{
    position:fixed;
    inset:-100px;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.grid{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(45,86,125,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(45,86,125,.055) 1px,
            transparent 1px
        );

    background-size:72px 72px;

    animation:gridMove 18s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0,0 0;
    }

    to{
        background-position:72px 72px,72px 72px;
    }

}

.glow{
    position:absolute;

    width:65vw;
    height:65vw;

    max-width:1000px;
    max-height:1000px;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(42,76,115,.18) 0%,
            rgba(42,76,115,.10) 22%,
            rgba(42,76,115,.035) 42%,
            transparent 70%
        );

    filter:blur(5px);

    animation:glowMove 14s ease-in-out infinite alternate;
}

@keyframes glowMove{

    0%{
        transform:
            translate(-54%,-48%)
            scale(.95);
    }

    50%{
        transform:
            translate(-46%,-53%)
            scale(1.05);
    }

    100%{
        transform:
            translate(-51%,-45%)
            scale(.98);
    }

}

.diagonal-light{
    position:absolute;
    inset:-100%;

    background:
        linear-gradient(
            135deg,
            transparent 0 46%,
            rgba(80,150,220,.045) 46.1% 46.2%,
            transparent 46.3%
        );

    animation:diagonalMove 22s linear infinite;
}

@keyframes diagonalMove{

    0%{
        transform:translate(-2%,-2%);
    }

    50%{
        transform:translate(2%,2%);
    }

    100%{
        transform:translate(-2%,-2%);
    }

}

.scanline{
    position:absolute;

    width:100%;
    height:1px;

    top:-10%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(100,180,240,.10),
            transparent
        );

    animation:scan 10s linear infinite;
}

@keyframes scan{

    0%{
        top:-10%;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    100%{
        top:110%;
        opacity:0;
    }

}


/* =========================================================
   PARTICLES
   ========================================================= */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:
        rgba(130,200,255,.5);

    box-shadow:
        0 0 8px rgba(100,190,255,.35);

    animation:
        particleFloat var(--duration)
        ease-in-out infinite alternate,

        particleBlink var(--blink)
        ease-in-out infinite;
}

@keyframes particleFloat{

    from{
        transform:translate(0,0);
    }

    to{
        transform:
            translate(
                var(--move-x),
                var(--move-y)
            );
    }

}

@keyframes particleBlink{

    0%,100%{
        opacity:.15;
    }

    50%{
        opacity:.8;
    }

}


/* =========================================================
   LANDING PAGE
   ========================================================= */

.page{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;

    z-index:2;

    transition:
        transform .9s cubic-bezier(.77,0,.18,1),
        opacity .7s ease;
}

body.profile-open .page{

    transform:
        translateY(12vh)
        scale(.97);

    opacity:0;

    pointer-events:none;
}


/* =========================================================
   CORNER DETAILS
   ========================================================= */

.page:before,
.page:after{

    content:"";

    position:absolute;

    width:60px;
    height:60px;

    border-color:
        rgba(90,166,235,.55);

    pointer-events:none;
}

.page:before{

    top:40px;
    left:40px;

    border-top:1px solid;
    border-left:1px solid;
}

.page:after{

    right:40px;
    bottom:40px;

    border-right:1px solid;
    border-bottom:1px solid;
}

.corner{

    position:absolute;

    font-size:11px;

    letter-spacing:.28em;

    color:
        rgba(105,173,232,.55);

    text-transform:uppercase;
}

.top-left{

    top:68px;
    left:80px;

}

.top-right{

    top:68px;
    right:80px;

}

.bottom-left{

    bottom:68px;
    left:80px;

}

.bottom-right{

    bottom:68px;
    right:80px;

}


/* =========================================================
   LOGO
   ========================================================= */

.logo{

    font-size:
        clamp(70px,10vw,150px);

    line-height:1;

    font-weight:600;

    letter-spacing:-.07em;

    text-shadow:
        0 0 38px
        rgba(110,180,255,.25);

    margin-bottom:48px;

    animation:
        logoGlow 5s ease-in-out
        infinite alternate;
}

@keyframes logoGlow{

    0%{
        text-shadow:
            0 0 25px
            rgba(110,180,255,.18);
    }

    100%{
        text-shadow:
            0 0 45px
            rgba(110,180,255,.40);
    }

}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider{

    width:540px;
    max-width:70vw;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(102,177,242,.65),
            transparent
        );

    position:relative;

    margin-bottom:42px;
}

.divider:after{

    content:"///";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-54%);

    padding:0 16px;

    background:#05080d;

    color:#6cb9f5;

    font-size:14px;
}


/* =========================================================
   FOLLOW
   ========================================================= */

.follow{

    font-size:16px;

    letter-spacing:.22em;

    color:#b8c8d9;

    text-transform:uppercase;

    margin-bottom:36px;
}


/* =========================================================
   SOCIAL LINKS
   ========================================================= */

.socials{

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:80px;

    border-left:
        1px solid
        rgba(86,157,218,.45);

    border-right:
        1px solid
        rgba(86,157,218,.45);

    padding:9px 30px;
}

.socials a{

    color:#eef6ff;

    text-decoration:none;

    font-size:16px;

    font-weight:500;

    letter-spacing:.2em;

    padding:0 38px;

    transition:
        color .25s,
        text-shadow .25s,
        transform .25s;
}

.socials a+a{

    border-left:
        1px solid
        rgba(86,157,218,.35);
}

.socials a:hover{

    color:#8fd0ff;

    text-shadow:
        0 0 18px
        rgba(96,183,255,.7);

    transform:
        translateY(-2px);
}


/* =========================================================
   CHARACTER PROFILE BUTTON
   ========================================================= */

.profile{

    min-width:510px;

    padding:27px 66px;

    border:
        1px solid
        rgba(100,183,246,.75);

    color:#f4f8ff;

    position:relative;

    cursor:pointer;

    font-family:
        "Oxanium",sans-serif;

    clip-path:
        polygon(
            25px 0,
            calc(100% - 25px) 0,
            100% 25px,
            100% calc(100% - 25px),
            calc(100% - 25px) 100%,
            25px 100%,
            0 calc(100% - 25px),
            0 25px
        );

    background:
        rgba(5,12,20,.42);

    transition:
        background .25s,
        box-shadow .25s,
        transform .25s;
}

.profile:hover{

    background:
        rgba(40,91,135,.18);

    box-shadow:
        0 0 38px
        rgba(67,157,225,.16);

    transform:
        translateY(-3px);
}

.profile-text{

    font-size:16px;

    font-weight:600;

    letter-spacing:.24em;
}

.triangle{

    display:block;

    margin-top:18px;

    color:#8bcfff;

    font-size:16px;

    transition:
        transform .3s,
        text-shadow .3s;
}

.profile:hover .triangle{

    transform:
        translateY(7px);

    text-shadow:
        0 0 16px
        rgba(110,195,255,.9);
}


/* =========================================================
   STATUS
   ========================================================= */

.status{

    position:absolute;

    bottom:48px;
    left:50%;

    transform:
        translateX(-50%);

    font-size:9px;

    letter-spacing:.28em;

    color:
        rgba(120,177,218,.42);

    text-transform:uppercase;
}


/* =========================================================
   CHARACTER SCREEN
   ========================================================= */

.character-screen{

    position:fixed;

    inset:0;

    z-index:10;

    background:
        linear-gradient(
            rgba(3,8,14,.88),
            rgba(3,8,14,.96)
        );

    transform:
        translateY(-100%);

    opacity:0;

    transition:
        transform .9s
        cubic-bezier(.77,0,.18,1),

        opacity .65s ease;

    overflow:hidden;

    pointer-events:none;
}

body.profile-open
.character-screen{

    transform:
        translateY(0);

    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   CHARACTER HEADER
   ========================================================= */

.character-header{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:110px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 75px;

    border-bottom:
        1px solid
        rgba(86,157,218,.30);

    background:
        rgba(3,8,14,.55);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    z-index:5;
}

.character-title{

    display:flex;

    flex-direction:row;

    align-items:center;

    gap:18px;
}

.character-title-main{

    font-size:30px;

    font-weight:600;

    letter-spacing:.12em;
}

.character-title-sub{

    position:absolute;

    left:75px;

    top:76px;

    margin-top:8px;

    font-size:10px;

    letter-spacing:.28em;

    color:
        rgba(120,180,225,.55);
}


/* =========================================================
   PRESETS BUTTON
   ========================================================= */

.presets-button{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:11px 17px;

    border:
        1px solid
        rgba(100,183,246,.55);

    background:
        rgba(5,12,20,.5);

    color:#dceeff;

    text-decoration:none;

    font-family:
        "Oxanium",sans-serif;

    font-size:11px;

    font-weight:500;

    letter-spacing:.20em;

    cursor:pointer;

    transition:
        background .25s,
        color .25s,
        border-color .25s,
        box-shadow .25s,
        transform .25s;
}

.presets-button:hover{

    color:#fff;

    background:
        rgba(40,91,135,.25);

    border-color:
        rgba(125,205,255,.80);

    box-shadow:
        0 0 22px
        rgba(67,157,225,.18);

    transform:
        translateY(-2px);
}

.presets-icon{

    font-size:13px;

    line-height:1;
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.close-profile{

    border:
        1px solid
        rgba(100,183,246,.55);

    background:
        rgba(5,12,20,.5);

    color:#dceeff;

    padding:
        13px 22px;

    font-family:
        "Oxanium",sans-serif;

    font-size:11px;

    letter-spacing:.20em;

    cursor:pointer;

    transition:
        background .25s,
        color .25s,
        box-shadow .25s;
}

.close-profile:hover{

    color:#fff;

    background:
        rgba(40,91,135,.25);

    box-shadow:
        0 0 22px
        rgba(67,157,225,.18);
}


/* =========================================================
   CHARACTER SELECT
   ========================================================= */

.character-select{

    position:absolute;

    left:0;
    right:0;

    top:110px;
    bottom:0;

    padding:
        18px 30px 30px;

    display:flex;

    flex-direction:column;

    align-items:center;

    overflow:hidden;
}


/* =========================================================
   SELECT HEADING
   ========================================================= */

.select-heading{

    text-align:center;

    flex-shrink:0;

    margin-bottom:14px;
}

.select-heading-main{

    font-size:16px;

    font-weight:500;

    letter-spacing:.28em;

    color:#dceeff;
}

.select-heading-sub{

    display:block;

    margin-top:7px;

    font-size:9px;

    letter-spacing:.20em;

    color:
        rgba(120,180,225,.42);
}


/* =========================================================
   CHARACTER GRID
   ========================================================= */

.character-grid{

    width:min(1350px,96vw);

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:14px;

    overflow-y:auto;

    padding:
        8px 10px 15px;

    scrollbar-width:thin;

    scrollbar-color:
        rgba(100,180,235,.35)
        transparent;
}


/* =========================================================
   CHARACTER ROW
   ========================================================= */

.character-row{

    display:flex;

    justify-content:center;

    gap:14px;

    flex-shrink:0;
}


/* =========================================================
   CHARACTER CARD
   ========================================================= */

.character-item{

    width:
        clamp(105px,8vw,158px);

    height:
        clamp(165px,12.5vw,248px);

    flex-shrink:0;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0;

    border:
        1px solid
        rgba(90,160,215,.30);

    background:
        linear-gradient(
            145deg,
            rgba(18,38,57,.48),
            rgba(4,10,16,.68)
        );

    color:#dceeff;

    font-family:
        "Oxanium",sans-serif;

    cursor:pointer;

    overflow:hidden;

    clip-path:
        polygon(
            10px 0,
            calc(100% - 10px) 0,
            100% 10px,
            100% calc(100% - 10px),
            calc(100% - 10px) 100%,
            10px 100%,
            0 calc(100% - 10px),
            0 10px
        );

    transition:
        transform .2s,
        border-color .2s,
        background .2s,
        box-shadow .2s;
}

.character-item:hover{

    transform:
        translateY(-5px)
        scale(1.025);

    border-color:
        rgba(125,205,255,.70);

    background:
        linear-gradient(
            145deg,
            rgba(32,72,103,.55),
            rgba(5,14,22,.75)
        );

    box-shadow:
        0 0 24px
        rgba(65,155,220,.18);
}

.character-item.active{

    border-color:
        rgba(135,215,255,.95);

    background:
        linear-gradient(
            145deg,
            rgba(38,88,125,.58),
            rgba(5,14,22,.82)
        );

    box-shadow:
        0 0 28px
        rgba(65,170,240,.25),

        inset 0 0 22px
        rgba(90,180,240,.08);
}

.character-item.active:after{

    content:"";

    position:absolute;

    inset:4px;

    border:
        1px solid
        rgba(140,220,255,.28);

    pointer-events:none;
}


/* =========================================================
   PORTRAIT
   ========================================================= */

.character-portrait{

    position:absolute;

    inset:0;

    border:0;

    background:
        radial-gradient(
            circle at center,
            rgba(70,135,180,.12),
            rgba(3,8,14,.20) 60%,
            transparent 75%
        );

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.character-portrait:before{

    content:"PORTRAIT";

    font-size:8px;

    letter-spacing:.18em;

    color:
        rgba(140,195,230,.22);
}


/* =========================================================
   MUSIC CONTROL
   ========================================================= */

.music-control{

    position:fixed;

    right:40px;
    bottom:40px;

    z-index:30;

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        9px 13px;

    border:
        1px solid
        rgba(90,166,235,.35);

    background:
        rgba(3,8,14,.72);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    clip-path:
        polygon(
            10px 0,
            100% 0,
            100% calc(100% - 10px),
            calc(100% - 10px) 100%,
            0 100%,
            0 10px
        );
}

.music-button{

    width:34px;
    height:28px;

    border:0;

    background:transparent;

    color:#8fd0ff;

    font-family:
        "Oxanium",sans-serif;

    font-size:14px;

    cursor:pointer;

    transition:
        color .2s,
        text-shadow .2s;
}

.music-button:hover{

    color:#fff;

    text-shadow:
        0 0 12px
        rgba(100,190,255,.8);
}

.volume-slider{

    width:90px;

    appearance:none;
    -webkit-appearance:none;

    height:3px;

    background:
        rgba(120,180,220,.35);

    outline:none;

    cursor:pointer;
}

.volume-slider::-webkit-slider-thumb{

    appearance:none;
    -webkit-appearance:none;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#8fd0ff;

    box-shadow:
        0 0 9px
        rgba(100,190,255,.8);
}

.volume-slider::-moz-range-thumb{

    width:10px;
    height:10px;

    border:none;

    border-radius:50%;

    background:#8fd0ff;

    box-shadow:
        0 0 9px
        rgba(100,190,255,.8);
}

.music-label{

    font-size:9px;

    letter-spacing:.18em;

    color:
        rgba(140,190,225,.55);

    user-select:none;
}

audio{
    display:none;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    body{
        overflow:hidden;
    }

    .page{
        min-height:560px;
        padding:0 20px;
    }

    .corner{
        display:none;
    }

    .page:before,
    .page:after{
        width:32px;
        height:32px;
    }

    .page:before{
        top:20px;
        left:20px;
    }

    .page:after{
        right:20px;
        bottom:20px;
    }

    .logo{

        font-size:58px;

        margin-bottom:30px;
    }

    .divider{

        width:280px;

        margin-bottom:28px;
    }

    .follow{

        font-size:9px;

        letter-spacing:.14em;

        max-width:90vw;

        line-height:1.8;
    }

    .socials{

        padding:6px 5px;

        margin-bottom:50px;
    }

    .socials a{

        font-size:9px;

        padding:0 11px;

        letter-spacing:.12em;
    }

    .profile{

        min-width:
            min(330px,88vw);

        padding:
            17px 25px;
    }

    .profile-text{

        font-size:10px;

        letter-spacing:.18em;
    }

    .status{

        bottom:22px;
    }


    /* CHARACTER HEADER */

    .character-header{

        height:76px;

        padding:
            0 18px;
    }

    .character-title{

        gap:8px;

        max-width:
            calc(100% - 70px);
    }

    .character-title-main{

        font-size:15px;
    }

    .character-title-sub{

        position:absolute;

        left:18px;

        top:48px;

        font-size:5px;
    }

    .presets-button{

        padding:
            7px 8px;

        font-size:6px;

        letter-spacing:.12em;

        gap:4px;
    }

    .presets-icon{

        font-size:8px;
    }

    .close-profile{

        padding:
            8px 11px;

        font-size:7px;
    }


    /* CHARACTER SELECT */

    .character-select{

        top:76px;

        padding:
            10px 5px 15px;
    }

    .select-heading{

        margin-bottom:7px;
    }

    .select-heading-main{

        font-size:10px;
    }

    .select-heading-sub{

        font-size:5px;
    }


    /* MOBILE CHARACTER GRID */

    .character-grid{

        width:100%;

        gap:6px;

        padding:
            3px 3px 8px;
    }

    .character-row{

        gap:4px;
    }

    .character-item{

        width:
            calc((92vw - 20px) / 4);

        height:
            calc((92vw - 20px) / 4 * 1.57);

        max-width:82px;

        max-height:129px;
    }


    /* MUSIC */

    .music-control{

        right:16px;

        bottom:16px;
    }

    .music-label{
        display:none;
    }

    .volume-slider{
        width:65px;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     MOVING BACKGROUND
     ======================================================= -->

<div class="background">

    <div class="grid"></div>

    <div class="glow"></div>

    <div class="diagonal-light"></div>

    <div class="scanline"></div>

    <div
        class="particles"
        id="particles">
    </div>

</div>


<!-- =======================================================
     LOCAL MUSIC
     ======================================================= -->

<audio
    id="backgroundMusic"
    loop
    preload="auto"
>

    <source
        src="audio/background.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- =======================================================

<div class="music-control">

    >

    <input

        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        value="35"
        aria-label="Music volume"
    >

</div>


<script>

/* =========================================================
   PARTICLES
   ========================================================= */

const particleContainer =
    document.getElementById("particles");

const particleCount =
    window.innerWidth <= 600
        ? 20
        : 35;

for(
    let i = 0;
    i < particleCount;
    i++
){

    const particle =
        document.createElement("span");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        Math.random() * 100 + "%";

    particle.style.setProperty(
        "--move-x",
        (Math.random() * 80 - 40) + "px"
    );

    particle.style.setProperty(
        "--move-y",
        (Math.random() * 80 - 40) + "px"
    );

    particle.style.setProperty(
        "--duration",
        (5 + Math.random() * 8) + "s"
    );

    particle.style.setProperty(
        "--blink",
        (2 + Math.random() * 5) + "s"
    );

    particle.style.animationDelay =
        (-Math.random() * 8) + "s";

    particleContainer.appendChild(
        particle
    );
}


/* =========================================================
   MUSIC
   ========================================================= */

const music =
    document.getElementById(
        "backgroundMusic"
    );

const muteButton =
    document.getElementById(
        "muteButton"
    );

const volumeSlider =
    document.getElementById(
        "volumeSlider"
    );

let isMuted = false;

music.volume =
    Number(volumeSlider.value) / 100;


function startMusic(){

    music.play().catch(
        function(){}
    );

}

startMusic();


function firstInteraction(){

    startMusic();

    document.removeEventListener(
        "click",
        firstInteraction
    );

    document.removeEventListener(
        "keydown",
        firstInteraction
    );

    document.removeEventListener(
        "pointerdown",
        firstInteraction
    );
}

document.addEventListener(
    "click",
    firstInteraction
);

document.addEventListener(
    "keydown",
    firstInteraction
);

document.addEventListener(
    "pointerdown",
    firstInteraction
);


muteButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        if(isMuted){

            music.muted = false;

            muteButton.textContent =
                "🔊";

            isMuted = false;

            startMusic();

        }
        else{

            music.muted = true;

            muteButton.textContent =
                "🔇";

            isMuted = true;

        }

    }
);


volumeSlider.addEventListener(
    "input",
    function(){

        const volume =
            Number(this.value) / 100;

        music.volume =
            volume;

        if(volume === 0){

            music.muted = true;

            muteButton.textContent =
                "🔇";

            isMuted = true;

        }
        else{

            music.muted = false;

            muteButton.textContent =
                "🔊";

            isMuted = false;

        }

    }
);


/* =========================================================
   CHARACTERS
   ========================================================= */

const characters = [

    "Rion Adachi",
    "Ayami Karasuma",
    "Elsa von Rietveld",
    "Raeda Baxley",
    "Alina Engel",
    "Nova Meledyne",

    "Kiyoko Karasu",
    "Yuzu Irumi",
    "Ro-Eun Yeong",
    "Kouka Arisato",
    "Claudine Celesta",

    "Fia Andini",
    "Finley Camelia",
    "Yume Izumi",
    "Milica Belic",
    "Jasmine Lavenza",
    "Mayumi Inoue",

    "Ethyln Bernard",
    "Diane Cerezyna Tsoi",
    "Vera Rochester",
    "Kira Marinka Orlova",
    "Naomi Tausend",

    "Eimi Shimizu",
    "Lin Hua Ying",
    "Randall Gray",
    "Mai Habara"

];


/* =========================================================
   ROW STRUCTURE
   ========================================================= */

const rowSizes = [
    6,
    5,
    6,
    5,
    4
];


const characterGrid =
    document.getElementById(
        "characterGrid"
    );


let characterIndex = 0;


rowSizes.forEach(
    function(rowSize){

        const row =
            document.createElement("div");

        row.className =
            "character-row";


        for(
            let i = 0;
            i < rowSize;
            i++
        ){

            const index =
                characterIndex;

            const name =
                characters[index];


            const item =
                document.createElement("button");

            item.className =
                "character-item";

            item.type =
                "button";

            item.setAttribute(
                "aria-label",
                "Select " + name
            );


            item.innerHTML = `

                <span
                    class="character-portrait"
                    title="${name}"
                ></span>

            `;


            item.addEventListener(
                "click",
                function(){

                    document
                        .querySelectorAll(
                            ".character-item"
                        )
                        .forEach(
                            function(card){
                                card.classList.remove(
                                    "active"
                                );
                            }
                        );

                    item.classList.add(
                        "active"
                    );

                }
            );


            row.appendChild(
                item
            );


            characterIndex++;

        }


        characterGrid.appendChild(
            row
        );

    }
);


/* =========================================================
   INITIAL CHARACTER
   ========================================================= */

const firstCharacter =
    document.querySelector(
        ".character-item"
    );

if(firstCharacter){

    firstCharacter.classList.add(
        "active"
    );

}


/* =========================================================
   OPEN CHARACTER SELECT
   ========================================================= */

const openProfile =
    document.getElementById(
        "openProfile"
    );

const closeProfile =
    document.getElementById(
        "closeProfile"
    );

const characterScreen =
    document.getElementById(
        "characterScreen"
    );


openProfile.addEventListener(
    "click",
    function(){

        document.body.classList.add(
            "profile-open"
        );

        characterScreen.setAttribute(
            "aria-hidden",
            "false"
        );

    }
);


/* =========================================================
   CLOSE CHARACTER SELECT
   ========================================================= */

closeProfile.addEventListener(
    "click",
    function(){

        document.body.classList.remove(
            "profile-open"
        );

        characterScreen.setAttribute(
            "aria-hidden",
            "true"
        );

    }
);


/* =========================================================
   ESC KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            document.body.classList.contains(
                "profile-open"
            )
        ){

            document.body.classList.remove(
                "profile-open"
            );

            characterScreen.setAttribute(
                "aria-hidden",
                "true"
            );

        }

    }
);

</script>
