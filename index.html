<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dex-3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
 background:radial-gradient(circle at 50% 42%,rgba(42,76,115,.16),transparent 30%),
 linear-gradient(rgba(45,86,125,.055) 1px,transparent 1px),
 linear-gradient(90deg,rgba(45,86,125,.055) 1px,transparent 1px),#03060a;
 background-size:auto,72px 72px,72px 72px;color:#f4f8ff;
 font-family:"Oxanium",sans-serif;overflow:hidden
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
 background:linear-gradient(135deg,transparent 0 46%,rgba(80,150,220,.045) 46.1% 46.2%,transparent 46.3%)}
.page{width:100%;height:100vh;min-height:620px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;position:relative}
.page:before,.page:after{content:"";position:absolute;width:46px;height:46px;
 border-color:rgba(90,166,235,.55);pointer-events:none}
.page:before{top:30px;left:30px;border-top:1px solid;border-left:1px solid}
.page:after{right:30px;bottom:30px;border-right:1px solid;border-bottom:1px solid}
.corner{position:absolute;font-size:8px;letter-spacing:.28em;color:rgba(105,173,232,.55);text-transform:uppercase}
.top-left{top:54px;left:60px}.top-right{top:54px;right:60px}
.bottom-left{bottom:54px;left:60px}.bottom-right{bottom:54px;right:60px}
.logo{font-size:clamp(54px,8vw,100px);line-height:1;font-weight:600;letter-spacing:-.07em;
 text-shadow:0 0 28px rgba(110,180,255,.25);margin-bottom:38px}
.divider{width:360px;max-width:65vw;height:1px;background:linear-gradient(90deg,transparent,rgba(102,177,242,.65),transparent);
 position:relative;margin-bottom:34px}
.divider:after{content:"///";position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);
 padding:0 12px;background:#05080d;color:#6cb9f5;font-size:10px}
.follow{font-size:12px;letter-spacing:.22em;color:#b8c8d9;text-transform:uppercase;margin-bottom:28px}
.socials{display:flex;align-items:center;justify-content:center;margin-bottom:64px;
 border-left:1px solid rgba(86,157,218,.45);border-right:1px solid rgba(86,157,218,.45);padding:7px 24px}
.socials a{color:#eef6ff;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.2em;padding:0 28px;
 transition:color .25s,text-shadow .25s,opacity .25s}
.socials a+a{border-left:1px solid rgba(86,157,218,.35)}
.socials a:hover{color:#8fd0ff;text-shadow:0 0 14px rgba(96,183,255,.7)}
.profile{min-width:340px;padding:18px 44px;border:1px solid rgba(100,183,246,.75);color:#f4f8ff;text-decoration:none;
 position:relative;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);
 background:rgba(5,12,20,.42);transition:background .25s,box-shadow .25s,transform .25s}
.profile:hover{background:rgba(40,91,135,.18);box-shadow:0 0 28px rgba(67,157,225,.16);transform:translateY(-2px)}
.profile-text{font-size:12px;font-weight:600;letter-spacing:.24em}
.triangle{display:block;margin-top:14px;color:#8bcfff;font-size:13px;transition:transform .3s,text-shadow .3s}
.profile:hover .triangle{transform:translateY(5px);text-shadow:0 0 12px rgba(110,195,255,.9)}
.status{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);font-size:7px;letter-spacing:.28em;color:rgba(120,177,218,.42);text-transform:uppercase}
@media(max-width:600px){
 body{background-size:auto,48px 48px,48px 48px}.page{min-height:560px;padding:0 20px}.corner{display:none}
 .logo{font-size:58px;margin-bottom:30px}.follow{font-size:9px;letter-spacing:.14em;max-width:90vw;line-height:1.8}
 .socials{padding:6px 5px;margin-bottom:50px}.socials a{font-size:9px;padding:0 11px;letter-spacing:.12em}
 .profile{min-width:min(330px,88vw);padding:17px 25px}.profile-text{font-size:10px;letter-spacing:.18em}.status{bottom:22px}
}
</style>
</head>
<body>
<main class="page">
<span class="corner top-left">DEX-3 // PORTAL</span>
<span class="corner top-right">SYSTEM ONLINE</span>
<span class="corner bottom-left">ACCESS POINT</span>
<span class="corner bottom-right">V1.0.0</span>

<h1 class="logo">dex-3</h1>
<div class="divider"></div>
<p class="follow">Be sure to follow me on this platform!</p>

<nav class="socials" aria-label="Social media">
<a href="https://x.com/sorawindy" target="_blank" rel="noopener noreferrer">Twitter</a>
<a href="https://www.pixiv.net/en/users/50033895" target="_blank" rel="noopener noreferrer">Pixiv</a>
<a href="https://www.deviantart.com/dex-3" target="_blank" rel="noopener noreferrer">DeviantArt</a>
</nav>

<a href="#" class="profile" aria-label="Character Profile">
<span class="profile-text">CHARACTER PROFILE</span>
<span class="triangle">▼</span>
</a>
<span class="status">PERSONAL CREATIVE PORTAL</span>
</main>
</body>
</html>
